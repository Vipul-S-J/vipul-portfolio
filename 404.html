<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Page not found — Vipul S Jain</title>
  <script>try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <style>
    :root { color-scheme: dark; --bg: #0d0506; --fg: #f2d9dc; --muted: #b08a8f; --accent: #ff3b4e; --on-accent: #1a0306; --border: rgba(255,255,255,.1); }
    :root[data-theme="light"] { color-scheme: light; --bg: #faf6f5; --fg: #2a1418; --muted: #6a5156; --accent: #d9182e; --on-accent: #fff; --border: rgba(40,12,16,.15); }
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 2rem; text-align: center;
      background: radial-gradient(600px circle at 50% 30%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 65%), var(--bg);
      color: var(--muted); font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; line-height: 1.6; }
    .code { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: clamp(5rem, 22vw, 11rem); font-weight: 700; line-height: 1; letter-spacing: -0.04em;
      color: transparent; -webkit-text-stroke: 2px var(--accent); }
    h1 { margin: 1rem 0 .5rem; font-size: clamp(1.5rem, 4vw, 2.1rem); color: var(--fg); }
    p { max-width: 34rem; margin: 0 auto 2rem; }
    a { display: inline-flex; align-items: center; gap: .5rem; padding: .85rem 1.5rem; border-radius: 10px; text-decoration: none;
      font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 600; font-size: .9rem; color: var(--on-accent); background: var(--accent); }
    a:hover { filter: brightness(1.1); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="code" aria-hidden="true">404</div>
    <h1>This page doesn't exist</h1>
    <p>The link may be old or mistyped. The portfolio home page has everything.</p>
    <a href="https://vipul-s-j.github.io/vipul-portfolio/">&larr; Back to portfolio</a>
  </main>
</body>
</html>
